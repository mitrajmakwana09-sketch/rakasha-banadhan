<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rakhi Surprise ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 50% 60%, #3a071f 0%, #180314 35%, #050108 75%);
            color: white;
        }

        /* Background glow */
        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #ff176d;
            opacity: 0.08;
            filter: blur(100px);
            border-radius: 50%;
            top: 20%;
            left: 40%;
            animation: glow 5s infinite alternate;
        }

        @keyframes glow {
            from {
                transform: scale(0.8);
            }
            to {
                transform: scale(1.3);
            }
        }

        /* Navbar */
        .navbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffd369;
            font-size: 22px;
            font-family: Georgia, serif;
        }

        .logo-icon {
            width: 35px;
            height: 35px;
            border: 3px solid #ffb52e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px #ff9d00;
            animation: rotate 6s linear infinite;
        }

        @keyframes rotate {
            to {
                transform: rotate(360deg);
            }
        }

        .music-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid #ff4d8d;
            background: rgba(255, 0, 90, 0.12);
            color: white;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 50, 120, 0.5);
        }

        .music-btn:hover {
            transform: scale(1.1);
        }

        /* Main */
        .hero {
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .content {
            width: 90%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }

        .text-area {
            width: 48%;
            animation: slideLeft 1.2s ease;
        }

        @keyframes slideLeft {
            from {
                opacity: 0;
                transform: translateX(-70px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .small-title {
            font-size: 25px;
            margin-bottom: 5px;
        }

        .main-title {
            font-family: Georgia, serif;
            font-size: clamp(55px, 7vw, 90px);
            line-height: 0.95;
            font-style: italic;
            color: #ffc447;
            text-shadow:
                0 0 10px rgba(255, 196, 71, 0.5),
                0 0 30px rgba(255, 150, 0, 0.25);
        }

        .for-you {
            font-size: 34px;
            margin-top: 15px;
            font-family: Georgia, serif;
        }

        .heart {
            color: #ff477e;
            animation: heartbeat 1.3s infinite;
            display: inline-block;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
        }

        .description {
            max-width: 430px;
            margin: 28px 0;
            color: #ddd;
            font-size: 18px;
            line-height: 1.7;
        }

        /* Button */
        .open-btn {
            position: relative;
            padding: 17px 38px;
            border: 2px solid #ffbf40;
            border-radius: 50px;
            background: linear-gradient(90deg, #ff286f, #ff7043);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow:
                0 0 15px rgba(255, 60, 100, 0.8),
                0 0 40px rgba(255, 150, 0, 0.3);
            transition: 0.3s;
            overflow: hidden;
        }

        .open-btn:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow:
                0 0 25px rgba(255, 60, 100, 1),
                0 0 50px rgba(255, 150, 0, 0.5);
        }

        .open-btn::before {
            content: "";
            position: absolute;
            width: 80px;
            height: 100%;
            background: rgba(255,255,255,0.25);
            transform: skewX(-25deg);
            left: -100px;
            top: 0;
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% {
                left: -100px;
            }
            45%, 100% {
                left: 130%;
            }
        }

        /* Gift area */
        .gift-area {
            width: 45%;
            height: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: slideRight 1.2s ease;
        }

        @keyframes slideRight {
            from {
                opacity: 0;
                transform: translateX(70px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .gift-glow {
            position: absolute;
            width: 330px;
            height: 330px;
            background: #ff9d00;
            opacity: 0.18;
            filter: blur(80px);
            border-radius: 50%;
            animation: giftGlow 2s infinite alternate;
        }

        @keyframes giftGlow {
            from {
                transform: scale(0.85);
            }
            to {
                transform: scale(1.15);
            }
        }

        /* Gift */
        .gift {
            position: relative;
            width: 230px;
            height: 190px;
            margin-top: 60px;
            animation: floating 3s ease-in-out infinite;
            z-index: 4;
        }

        @keyframes floating {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-18px);
            }
        }

        .gift-box {
            position: absolute;
            width: 230px;
            height: 145px;
            bottom: 0;
            background: linear-gradient(135deg, #7b1038, #260316);
            border: 2px solid #ff9d22;
            border-radius: 4px 4px 12px 12px;
            box-shadow:
                inset 0 0 25px rgba(255, 120, 0, 0.25),
                0 20px 40px rgba(0,0,0,0.5);
        }

        .gift-box::after {
            content: "";
            position: absolute;
            width: 38px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #ff9e20, #ffd04a, #ff8c00);
            box-shadow: 0 0 15px rgba(255,170,30,0.5);
        }

        .gift-lid {
            position: absolute;
            width: 250px;
            height: 48px;
            left: -10px;
            top: 35px;
            border: 2px solid #ff9d22;
            border-radius: 6px;
            background: linear-gradient(135deg, #a71951, #4a0926);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            z-index: 5;
        }

        .gift-lid::after {
            content: "";
            position: absolute;
            width: 38px;
            height: 48px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #ff9e20, #ffd04a, #ff8c00);
        }

        /* Bow */
        .bow {
            position: absolute;
            width: 110px;
            height: 60px;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 8;
        }

        .bow-left,
        .bow-right {
            position: absolute;
            width: 65px;
            height: 48px;
            background: linear-gradient(135deg, #ffb72e, #ff6c12);
            border: 2px solid #ffd96a;
            border-radius: 60% 20% 60% 20%;
        }

        .bow-left {
            left: -5px;
            transform: rotate(25deg);
        }

        .bow-right {
            right: -5px;
            transform: rotate(-25deg) scaleX(-1);
        }

        .bow-center {
            position: absolute;
            width: 27px;
            height: 27px;
            background: #ffd35a;
            border: 2px solid #fff0a6;
            border-radius: 50%;
            left: 50%;
            top: 18px;
            transform: translateX(-50%);
            box-shadow: 0 0 15px #ffb000;
        }

        /* Particles */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ffc13b;
            box-shadow: 0 0 10px #ff9d00;
            animation: particleMove linear infinite;
        }

        @keyframes particleMove {
            from {
                transform: translateY(110vh) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            to {
                transform: translateY(-20vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Floating hearts */
        .floating-heart {
            position: absolute;
            color: #ff4c86;
            font-size: 20px;
            animation: floatHeart 5s linear infinite;
            opacity: 0.8;
        }

        @keyframes floatHeart {
            from {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
            30% {
                opacity: 1;
            }
            to {
                transform: translateY(-20vh) scale(1.2) rotate(20deg);
                opacity: 0;
            }
        }

        /* Bottom arrow */
        .scroll-down {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            color: #ffc34a;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translate(-50%, 0);
            }
            50% {
                transform: translate(-50%, 10px);
            }
        }

        /* Responsive */
        @media (max-width: 800px) {

            body {
                overflow-y: auto;
            }

            .navbar {
                padding: 18px 5%;
            }

            .content {
                flex-direction: column;
                text-align: center;
                padding-top: 100px;
                padding-bottom: 70px;
            }

            .text-area {
                width: 100%;
                order: 1;
            }

            .gift-area {
                width: 100%;
                height: 330px;
                order: 2;
            }

            .description {
                margin: 20px auto;
                font-size: 16px;
            }

            .main-title {
                font-size: 60px;
            }

            .for-you {
                font-size: 28px;
            }

            .gift {
                transform: scale(0.8);
            }

            .gift-area {
                animation: none;
            }

            .scroll-down {
                display: none;
            }
        }

        @media (max-width: 450px) {

            .logo {
                font-size: 18px;
            }

            .logo-icon {
                width: 30px;
                height: 30px;
            }

            .music-btn {
                width: 40px;
                height: 40px;
            }

            .main-title {
                font-size: 52px;
            }

            .small-title {
                font-size: 20px;
            }

            .for-you {
                font-size: 25px;
            }

            .gift {
                transform: scale(0.7);
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            <div class="logo-icon">🌸</div>
            Rakhi Surprise
        </div>

        <button class="music-btn" id="musicBtn" onclick="toggleMusic()">
            🎵
        </button>

    </nav>


    <!-- Main Hero -->
    <main class="hero">

        <div class="content">

            <!-- Text -->
            <section class="text-area">

                <div class="small-title">
                    A Special
                </div>

                <h1 class="main-title">
                    Surprise
                </h1>

                <div class="for-you">
                    For You <span class="heart">❤️</span>
                </div>

                <p class="description">
                    This Rakhi, let's celebrate our beautiful
                    bond, our memories and all the happiness
                    we share together.
                </p>

                <button class="open-btn" onclick="openSurprise()">
                    OPEN GIFT 🎁
                </button>

            </section>


            <!-- Gift -->
            <section class="gift-area">

                <div class="gift-glow"></div>

                <div class="gift">

                    <div class="bow">
                        <div class="bow-left"></div>
                        <div class="bow-right"></div>
                        <div class="bow-center"></div>
                    </div>

                    <div class="gift-lid"></div>

                    <div class="gift-box"></div>

                </div>

            </section>

        </div>

    </main>


    <div class="scroll-down">
        ↓
    </div>


    <!-- Audio -->
    <audio id="rakhiMusic" loop>
        <source src="assets/audio/rakhi-music.mp3" type="audio/mpeg">
    </audio>


    <script>

        /* Create particles */
        function createParticles() {

            for (let i = 0; i < 35; i++) {

                const particle = document.createElement("div");

                particle.classList.add("particle");

                particle.style.left = Math.random() * 100 + "%";

                particle.style.animationDuration =
                    (4 + Math.random() * 7) + "s";

                particle.style.animationDelay =
                    Math.random() * 5 + "s";

                particle.style.width =
                    (3 + Math.random() * 5) + "px";

                particle.style.height =
                    particle.style.width;

                document.body.appendChild(particle);
            }
        }


        /* Create floating hearts */
        function createHearts() {

            for (let i = 0; i < 12; i++) {

                const heart = document.createElement("div");

                heart.classList.add("floating-heart");

                heart.innerHTML = "♥";

                heart.style.left =
                    Math.random() * 100 + "%";

                heart.style.animationDuration =
                    (5 + Math.random() * 6) + "s";

                heart.style.animationDelay =
                    Math.random() * 6 + "s";

                document.body.appendChild(heart);
            }
        }


        createParticles();
        createHearts();


        /* Music */
        const music = document.getElementById("rakhiMusic");
        const musicBtn = document.getElementById("musicBtn");

        let playing = false;

        function toggleMusic() {

            if (!playing) {

                music.play().catch(() => {});

                musicBtn.innerHTML = "🔊";

                playing = true;

            } else {

                music.pause();

                musicBtn.innerHTML = "🎵";

                playing = false;
            }
        }


        /* Open surprise */
        function openSurprise() {

            const button = document.querySelector(".open-btn");

            button.innerHTML = "OPENING... ✨";

            button.disabled = true;

            createConfetti();

            setTimeout(() => {

                window.location.href =
                    "pages/surprise.html";

            }, 1200);
        }


        /* Confetti */
        function createConfetti() {

            const symbols = [
                "✨",
                "❤️",
                "🌸",
                "💛",
                "🎉",
                "⭐"
            ];

            for (let i = 0; i < 50; i++) {

                const confetti =
                    document.createElement("div");

                confetti.innerHTML =
                    symbols[Math.floor(
                        Math.random() * symbols.length
                    )];

                confetti.style.position = "fixed";
                confetti.style.left =
                    Math.random() * 100 + "vw";
                confetti.style.top = "-30px";
                confetti.style.fontSize =
                    (15 + Math.random() * 20) + "px";
                confetti.style.zIndex = "100";
                confetti.style.pointerEvents = "none";

                document.body.appendChild(confetti);

                const duration =
                    1200 + Math.random() * 1800;

                confetti.animate(
                    [
                        {
                            transform: "translateY(0) rotate(0deg)",
                            opacity: 1
                        },
                        {
                            transform:
                                `translateY(110vh) rotate(${Math.random() * 720}deg)`,
                            opacity: 0
                        }
                    ],
                    {
                        duration: duration,
                        easing: "cubic-bezier(.2,.8,.3,1)"
                    }
                );

                setTimeout(() => {
                    confetti.remove();
                }, duration);
            }
        }

    </script>

</body>
</html>
