<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Your Surprise 🎁 | Rakhi Surprise</title>


    <style>

        /* =====================================================
           RESET
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           BODY
           ===================================================== */

        body {

            min-height: 100vh;

            overflow-x: hidden;

            font-family:
                Arial,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at center,
                    #45091f 0%,
                    #180313 40%,
                    #050108 85%
                );
        }


        /* =====================================================
           BACKGROUND GLOW
           ===================================================== */

        .background-glow {

            position: fixed;

            width: 500px;
            height: 500px;

            background: #ff9d00;

            opacity: 0.12;

            filter: blur(100px);

            border-radius: 50%;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            animation:
                glow 3s infinite alternate;

            pointer-events: none;

            z-index: 0;
        }


        @keyframes glow {

            from {

                transform:
                    translate(-50%, -50%)
                    scale(.7);

                opacity: .08;
            }

            to {

                transform:
                    translate(-50%, -50%)
                    scale(1.2);

                opacity: .2;
            }
        }


        /* =====================================================
           NAVBAR
           ===================================================== */

        .navbar {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;

            padding:
                22px 7%;

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            z-index: 50;
        }


        .logo {

            color: #ffd369;

            font-family:
                Georgia,
                serif;

            font-size: 22px;

            font-weight: bold;

            text-shadow:
                0 0 10px
                rgba(255, 211, 105, .3);
        }


        /* =====================================================
           MUSIC BUTTON
           ===================================================== */

        .music-btn {

            width: 45px;
            height: 45px;

            border-radius: 50%;

            border:
                1px solid #ff4d8d;

            background:
                rgba(255, 0, 90, .12);

            color: white;

            font-size: 19px;

            cursor: pointer;

            transition:
                .3s ease;
        }


        .music-btn:hover {

            transform:
                scale(1.1);

            background:
                rgba(255, 40, 111, .25);

            box-shadow:
                0 0 20px
                rgba(255, 40, 111, .5);
        }


        /* =====================================================
           MAIN
           ===================================================== */

        .container {

            width: 100%;

            min-height: 100vh;

            display: flex;

            justify-content:
                center;

            align-items:
                center;

            position: relative;

            z-index: 5;

            padding:
                100px 20px 40px;
        }


        .surprise-content {

            width: 100%;

            max-width: 850px;

            text-align: center;

            animation:
                appear 1.2s ease;
        }


        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    scale(.7);
            }

            to {

                opacity: 1;

                transform:
                    scale(1);
            }
        }


        /* =====================================================
           TEXT
           ===================================================== */

        .subtitle {

            font-size: 20px;

            color: #ddd;

            margin-bottom: 10px;
        }


        .title {

            font-family:
                Georgia,
                serif;

            font-style: italic;

            font-size:
                clamp(48px, 7vw, 78px);

            color: #ffc447;

            text-shadow:
                0 0 25px
                rgba(255, 190, 50, .4);

            margin-bottom: 20px;
        }


        .message {

            max-width: 550px;

            margin:
                auto;

            color: #ddd;

            line-height: 1.7;

            font-size: 17px;
        }


        /* =====================================================
           GIFT WRAPPER
           ===================================================== */

        .gift-wrapper {

            width: 300px;

            height: 330px;

            margin:
                25px auto 5px;

            position: relative;

            perspective: 800px;
        }


        /* =====================================================
           GIFT
           ===================================================== */

        .gift {

            position: absolute;

            width: 230px;

            height: 190px;

            left: 50%;
            top: 70px;

            transform:
                translateX(-50%);
        }


        /* =====================================================
           GIFT BOX
           ===================================================== */

        .gift-box {

            position: absolute;

            width: 230px;

            height: 140px;

            bottom: 0;

            left: 0;

            border:
                2px solid #ffad29;

            background:
                linear-gradient(
                    135deg,
                    #89143f,
                    #36051e
                );

            border-radius:
                5px 5px 12px 12px;

            box-shadow:
                0 15px 35px
                rgba(0,0,0,.5),

                inset 0 0 30px
                rgba(255,140,0,.15);
        }


        /* =====================================================
           RIBBON
           ===================================================== */

        .ribbon {

            position: absolute;

            width: 38px;

            height: 100%;

            left: 50%;

            transform:
                translateX(-50%);

            background:
                linear-gradient(
                    90deg,
                    #ff8c00,
                    #ffd34e,
                    #ff8c00
                );

            box-shadow:
                0 0 15px
                rgba(255,170,30,.5);

            z-index: 3;
        }


        /* =====================================================
           GIFT LID
           ===================================================== */

        .lid {

            position: absolute;

            width: 250px;

            height: 50px;

            left: -10px;

            top: -8px;

            border:
                2px solid #ffb22c;

            border-radius: 7px;

            background:
                linear-gradient(
                    135deg,
                    #aa174e,
                    #4d0828
                );

            z-index: 5;

            transform-origin:
                left bottom;

            transition:
                1.2s
                cubic-bezier(.2,.8,.3,1);
        }


        .lid-ribbon {

            position: absolute;

            width: 38px;

            height: 50px;

            left: 50%;

            transform:
                translateX(-50%);

            background:
                linear-gradient(
                    90deg,
                    #ff8c00,
                    #ffd34e,
                    #ff8c00
                );
        }


        /* =====================================================
           BOW
           ===================================================== */

        .bow {

            position: absolute;

            width: 120px;

            height: 65px;

            left: 50%;

            top: -45px;

            transform:
                translateX(-50%);

            z-index: 10;

            transition:
                1.2s ease;
        }


        .bow-left,
        .bow-right {

            position: absolute;

            width: 70px;

            height: 50px;

            background:
                linear-gradient(
                    135deg,
                    #ffbe38,
                    #ff6811
                );

            border:
                2px solid #ffe27c;
        }


        .bow-left {

            left: -5px;

            border-radius:
                60% 20% 60% 20%;

            transform:
                rotate(25deg);
        }


        .bow-right {

            right: -5px;

            border-radius:
                60% 20% 60% 20%;

            transform:
                rotate(-25deg);
        }


        .bow-center {

            position: absolute;

            width: 30px;

            height: 30px;

            border-radius: 50%;

            background: #ffd65b;

            border:
                2px solid #fff0a5;

            left: 50%;

            top: 18px;

            transform:
                translateX(-50%);

            box-shadow:
                0 0 18px #ffad00;
        }


        /* =====================================================
           GIFT LIGHT
           ===================================================== */

        .gift-light {

            position: absolute;

            width: 100px;

            height: 100px;

            background: #ffd65b;

            filter: blur(35px);

            border-radius: 50%;

            left: 50%;

            top: 20px;

            transform:
                translateX(-50%);

            opacity: 0;

            transition:
                1s;

            z-index: 1;
        }


        /* =====================================================
           GIFT OPEN ANIMATION
           ===================================================== */

        .gift.open .lid {

            transform:
                translateY(-110px)
                rotate(-8deg);
        }


        .gift.open .bow {

            transform:
                translate(-50%, -110px)
                rotate(-8deg);
        }


        .gift.open .gift-light {

            opacity: .8;

            animation:
                lightPulse 1s
                infinite alternate;
        }


        @keyframes lightPulse {

            from {

                transform:
                    translateX(-50%)
                    scale(.7);
            }

            to {

                transform:
                    translateX(-50%)
                    scale(1.3);
            }
        }


        /* =====================================================
           SURPRISE MESSAGE
           ===================================================== */

        .surprise-message {

            position: absolute;

            width: 100%;

            left: 50%;

            top: 115px;

            transform:
                translateX(-50%)
                scale(.5);

            opacity: 0;

            z-index: 4;

            transition:
                1s ease;

            pointer-events: none;
        }


        .gift.open
        ~ .surprise-message {

            opacity: 1;

            transform:
                translateX(-50%)
                scale(1);
        }


        .surprise-message span {

            display: block;

            font-family:
                Georgia,
                serif;

            font-size: 30px;

            color: #fff;

            text-shadow:
                0 0 10px #ffc447,
                0 0 25px #ff7b00;
        }


        /* =====================================================
           LETTER OPTION
           ===================================================== */

        .letter-option {

            display: none;

            margin-top: 0;

            text-align: center;

            opacity: 0;
        }


        .letter-option.show {

            display: block;

            animation:
                letterAppear
                .9s ease
                forwards;
        }


        @keyframes letterAppear {

            from {

                opacity: 0;

                transform:
                    translateY(25px)
                    scale(.85);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        .letter-hint {

            color:
                #ffe6a3;

            font-size: 15px;

            margin-bottom: 12px;

            text-shadow:
                0 0 10px
                rgba(255,196,71,.5);
        }


        /* =====================================================
           OPEN LETTER BUTTON
           ===================================================== */

        .continue-btn {

            padding:
                15px 32px;

            border:
                2px solid #ffc447;

            border-radius:
                50px;

            background:
                linear-gradient(
                    90deg,
                    #ff286f,
                    #ff7043
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 0 25px
                rgba(255,60,100,.5);

            transition:
                .3s ease;
        }


        .continue-btn:hover {

            transform:
                translateY(-3px)
                scale(1.05);

            box-shadow:
                0 8px 30px
                rgba(255,40,111,.6);
        }


        .continue-btn:active {

            transform:
                scale(.95);
        }


        /* =====================================================
           PARTICLES
           ===================================================== */

        .particle {

            position: fixed;

            width: 5px;

            height: 5px;

            background:
                #ffc447;

            border-radius: 50%;

            box-shadow:
                0 0 10px #ff9d00;

            pointer-events: none;

            z-index: 1;

            animation:
                particle 6s
                linear infinite;
        }


        @keyframes particle {

            from {

                transform:
                    translateY(110vh);

                opacity: 0;
            }

            20% {

                opacity: 1;
            }

            80% {

                opacity: 1;
            }

            to {

                transform:
                    translateY(-20vh);

                opacity: 0;
            }
        }


        /* =====================================================
           HEARTS
           ===================================================== */

        .heart {

            position: fixed;

            color:
                #ff4b83;

            font-size:
                20px;

            pointer-events:
                none;

            animation:
                heartFloat
                6s
                linear infinite;

            z-index: 2;

            text-shadow:
                0 0 10px
                rgba(255,75,131,.7);
        }


        @keyframes heartFloat {

            from {

                transform:
                    translateY(110vh)
                    scale(.5);

                opacity: 0;
            }

            20% {

                opacity: 1;
            }

            to {

                transform:
                    translateY(-20vh)
                    scale(1.2);

                opacity: 0;
            }
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            body {
                overflow-x: hidden;
            }


            .navbar {

                padding:
                    18px 5%;
            }


            .logo {

                font-size: 18px;
            }


            .music-btn {

                width: 42px;
                height: 42px;

                font-size: 17px;
            }


            .container {

                padding:
                    90px 15px 30px;
            }


            .subtitle {

                font-size: 17px;
            }


            .title {

                font-size: 50px;

                line-height:
                    1.05;
            }


            .message {

                width: 92%;

                font-size: 15px;

                line-height:
                    1.7;
            }


            .gift-wrapper {

                transform:
                    scale(.78);

                margin-top:
                    0;

                margin-bottom:
                    -15px;
            }


            .surprise-message span {

                font-size:
                    25px;
            }


            .letter-option {

                margin-top:
                    0;
            }


            .letter-hint {

                font-size:
                    14px;
            }


            .continue-btn {

                padding:
                    13px 25px;

                font-size:
                    14px;
            }
        }


        /* =====================================================
           SMALL MOBILE
           ===================================================== */

        @media (max-width: 400px) {

            .logo {

                font-size:
                    16px;
            }


            .title {

                font-size:
                    42px;
            }


            .subtitle {

                font-size:
                    15px;
            }


            .message {

                font-size:
                    13px;
            }


            .gift-wrapper {

                transform:
                    scale(.65);

                margin-top:
                    -20px;

                margin-bottom:
                    -40px;
            }


            .surprise-message span {

                font-size:
                    22px;
            }


            .continue-btn {

                padding:
                    12px 21px;

                font-size:
                    13px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND
         ===================================================== -->

    <div class="background-glow"></div>


    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <nav class="navbar">

        <div class="logo">
            🌸 Rakhi Surprise
        </div>


        <button
            class="music-btn"
            id="musicBtn"
            onclick="toggleMusic()">

            🎵

        </button>

    </nav>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="container">

        <section class="surprise-content">


            <p class="subtitle">

                ✨ You unlocked a special surprise ✨

            </p>


            <h1 class="title">

                Just For You ❤️

            </h1>


            <p class="message">

                Some surprises are wrapped in gifts,
                but the best ones are wrapped in love,
                memories and beautiful moments.

            </p>


            <!-- =================================================
                 GIFT
                 ================================================= -->

            <div class="gift-wrapper">


                <div class="gift">


                    <!-- Light -->

                    <div class="gift-light"></div>


                    <!-- Bow -->

                    <div class="bow">

                        <div class="bow-left"></div>

                        <div class="bow-right"></div>

                        <div class="bow-center"></div>

                    </div>


                    <!-- Lid -->

                    <div class="lid">

                        <div class="lid-ribbon"></div>

                    </div>


                    <!-- Box -->

                    <div class="gift-box">

                        <div class="ribbon"></div>

                    </div>


                    <!-- Surprise Text -->

                    <div class="surprise-message">

                        <span>
                            WOW! ✨
                        </span>

                        <span>
                            A Special Surprise ❤️
                        </span>

                    </div>


                </div>

            </div>


            <!-- =================================================
                 OPEN LETTER OPTION
                 ================================================= -->

            <div
                class="letter-option"
                id="letterOption">


                <p class="letter-hint">

                    ✨ Your surprise is ready... ✨

                </p>


                <button
                    class="continue-btn"
                    id="continueBtn"
                    onclick="goNext()">

                    OPEN MY LETTER 💌

                </button>


            </div>


        </section>

    </main>


    <!-- =====================================================
         MUSIC
         ===================================================== -->

    <audio
        id="rakhiMusic"
        loop>

        <source
            src="../assets/audio/rakhi-music.mp3"
            type="audio/mpeg">

    </audio>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>


        /* =====================================================
           ELEMENTS
           ===================================================== */

        const gift =
            document.querySelector(".gift");


        const letterOption =
            document.getElementById(
                "letterOption"
            );


        const music =
            document.getElementById(
                "rakhiMusic"
            );


        const musicBtn =
            document.getElementById(
                "musicBtn"
            );


        let musicPlaying = false;


        /* =====================================================
           GIFT OPENING
           ===================================================== */

        window.addEventListener(
            "load",
            () => {

                setTimeout(
                    () => {


                        /* Open Gift */

                        gift.classList.add(
                            "open"
                        );


                        /* Confetti */

                        createConfetti();


                        /* Show Letter Button */

                        setTimeout(
                            () => {

                                letterOption
                                    .classList
                                    .add("show");

                            },
                            1200
                        );


                    },
                    900
                );

            }
        );


        /* =====================================================
           MUSIC
           ===================================================== */

        function toggleMusic() {


            if (!musicPlaying) {


                music
                    .play()
                    .catch(() => {});


                musicBtn.innerHTML =
                    "🔊";


                musicPlaying = true;


            } else {


                music.pause();


                musicBtn.innerHTML =
                    "🎵";


                musicPlaying = false;

            }

        }


        /* =====================================================
           OPEN MESSAGE PAGE
           ===================================================== */

        function goNext() {


            /* Small celebration */

            createConfetti();


            /* Open message page */

            setTimeout(
                () => {

                    window.location.href =
                        "message.html";

                },
                700
            );

        }


        /* =====================================================
           CONFETTI
           ===================================================== */

        function createConfetti() {


            const symbols = [

                "✨",
                "❤️",
                "🌸",
                "💛",
                "🎉",
                "⭐",
                "🧵"

            ];


            for (
                let i = 0;
                i < 60;
                i++
            ) {


                const item =
                    document.createElement(
                        "div"
                    );


                item.innerHTML =
                    symbols[
                        Math.floor(
                            Math.random()
                            *
                            symbols.length
                        )
                    ];


                item.style.position =
                    "fixed";


                item.style.left =
                    Math.random()
                    * 100
                    + "vw";


                item.style.top =
                    "-30px";


                item.style.fontSize =
                    (
                        14
                        +
                        Math.random()
                        * 20
                    )
                    + "px";


                item.style.zIndex =
                    "100";


                item.style.pointerEvents =
                    "none";


                document.body.appendChild(
                    item
                );


                const duration =
                    1500
                    +
                    Math.random()
                    * 1800;


                item.animate(

                    [

                        {

                            transform:
                                "translateY(0) rotate(0deg)",

                            opacity: 1

                        },

                        {

                            transform:
                                `translateY(110vh) rotate(${Math.random() * 720}deg)`,

                            opacity: 0

                        }

                    ],

                    {

                        duration:
                            duration,

                        easing:
                            "cubic-bezier(.2,.8,.3,1)"

                    }

                );


                setTimeout(
                    () => {

                        item.remove();

                    },
                    duration
                );

            }

        }


        /* =====================================================
           BACKGROUND PARTICLES
           ===================================================== */

        function createParticles() {


            for (
                let i = 0;
                i < 35;
                i++
            ) {


                const particle =
                    document.createElement(
                        "div"
                    );


                particle.className =
                    "particle";


                particle.style.left =
                    Math.random()
                    * 100
                    + "vw";


                particle.style.animationDuration =
                    (
                        4
                        +
                        Math.random()
                        * 7
                    )
                    + "s";


                particle.style.animationDelay =
                    Math.random()
                    * 6
                    + "s";


                document.body.appendChild(
                    particle
                );

            }

        }


        /* =====================================================
           FLOATING HEARTS
           ===================================================== */

        function createHearts() {


            for (
                let i = 15;
                i > 0;
                i--
            ) {


                const heart =
                    document.createElement(
                        "div"
                    );


                heart.className =
                    "heart";


                heart.innerHTML =
                    "♥";


                heart.style.left =
                    Math.random()
                    * 100
                    + "vw";


                heart.style.animationDuration =
                    (
                        5
                        +
                        Math.random()
                        * 6
                    )
                    + "s";


                heart.style.animationDelay =
                    Math.random()
                    * 6
                    + "s";


                document.body.appendChild(
                    heart
                );

            }

        }


        /* =====================================================
           START BACKGROUND EFFECTS
           ===================================================== */

        createParticles();

        createHearts();


    </script>


</body>

</html>
